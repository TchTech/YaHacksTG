openapi: 3.1.0
info:
  title: YaHacks Mini App API
  version: 0.1.0
  description: Предлагаемый контракт между Telegram Mini App и сервером YaHacks.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /auth/telegram:
    post:
      operationId: createTelegramSession
      summary: Создать сессию Mini App
      description: Сервер проверяет подпись initData и допустимый возраст auth_date по правилам Telegram.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData:
                  type: string
                  minLength: 1
                  description: Исходная строка Telegram.WebApp.initData.
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
                    minLength: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getProfile
      summary: Получить свой профиль
      responses:
        '200':
          description: Профиль пользователя и его настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceProfile
      summary: Сохранить редактируемые поля своего профиля
      description: Заменяет личные данные авторизованного пользователя. Отсутствующие необязательные поля очищаются. Настройки рекомендаций сохраняются отдельно.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Profile'
                - type: object
                  properties:
                    name:
                      type: string
                      pattern: '\S'
      responses:
        '200':
          description: Сохранённые поля профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /me/team-search:
    put:
      operationId: replaceTeamSearch
      summary: Сохранить режим поиска команды
      description: 'Значение null выключает режим. Для event сервер проверяет, что хакатон ещё идёт, и возвращает название из каталога. Для other можно указать произвольное название.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamSearchMode'
      responses:
        '200':
          description: Сохранённый режим поиска команды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSearchMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /me/preferences:
    put:
      operationId: replacePreferences
      summary: Сохранить настройки рекомендаций
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Сохранённые настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /events:
    get:
      operationId: listRecommendedEvents
      summary: Получить рекомендованные события с учётом сохранённых настроек
      parameters:
        - name: scope
          in: query
          required: false
          description: 'Со scope=ongoing возвращает все хакатоны, идущие на текущую дату UTC, включая даты начала и окончания. Без scope действуют настройки рекомендаций.'
          schema:
            type: string
            enum: [ongoing]
      responses:
        '200':
          description: Список событий, который может быть пустым
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hackathon'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventIdPath'
    get:
      operationId: getEvent
      summary: Получить событие по ID независимо от настроек календаря
      responses:
        '200':
          description: Событие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hackathon'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /me/hackathons:
    get:
      operationId: listPlannedHackathons
      summary: Получить планы участия текущего пользователя
      responses:
        '200':
          description: Сохранённые хакатоны
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hackathon'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /me/hackathons/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventIdPath'
    put:
      operationId: planHackathon
      summary: Добавить событие в планы участия. Повторный запрос сохраняет один план.
      responses:
        '204':
          description: Событие добавлено
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removePlannedHackathon
      summary: Убрать событие из планов участия
      responses:
        '204':
          description: События больше нет в планах
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /people:
    get:
      operationId: listRecommendedPeople
      summary: Получить подборку участников
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Рекомендации в порядке приоритета. При eventId подбор учитывает участников, ищущих команду на этом событии. Уже приглашённые исключаются в рамках соответствующего подбора.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Запрошенное событие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /people/{personId}:
    get:
      operationId: getPerson
      summary: Получить доступный профиль участника по ID, даже если ему уже отправлено приглашение
      parameters:
        - $ref: '#/components/parameters/PersonIdPath'
      responses:
        '200':
          description: Профиль участника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /people/{personId}/invitation:
    put:
      operationId: invitePerson
      summary: Отправить запрос в команду
      description: Повтор запроса для той же пары пользователей и того же события возвращает 204 и сохраняет одно приглашение. Без eventId сохраняется общее приглашение для пары.
      parameters:
        - $ref: '#/components/parameters/PersonIdPath'
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Запрос принят
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Участник или событие не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /me/invitations:
    get:
      operationId: listInvitations
      summary: Получить входящие и исходящие приглашения текущего пользователя
      responses:
        '200':
          description: Приглашения. Контакт собеседника возвращается после принятия.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /me/invitations/{invitationId}:
    patch:
      operationId: replyToInvitation
      summary: Принять или отклонить входящее приглашение
      description: Ответить может только получатель. Повтор того же ответа возвращает текущее приглашение.
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  enum: [accepted, declined]
      responses:
        '200':
          description: Приглашение с сохранённым ответом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PersonIdPath:
      name: personId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EventId:
      name: eventId
      in: query
      required: false
      description: Идентификатор хакатона. Без параметра используется общий подбор.
      schema:
        type: string
        minLength: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    NotFound:
      description: Запись не найдена или недоступна текущему пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Данные запроса не прошли валидацию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Учётные данные отсутствуют, недействительны или просрочены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Запрос завершился ошибкой
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Preferences:
      type: object
      required: [role, format, reminderDays]
      properties:
        role:
          type: string
          minLength: 1
          maxLength: 80
        format:
          type: string
          enum: [online, in-person, any]
        reminderDays:
          type: integer
          enum: [0, 1, 2, 7]
          description: Число дней до дедлайна, ноль выключает напоминания.
    TextList:
      type: array
      items:
        type: string
    Profile:
      type: object
      required: [name, role, status, skills, summary, about, teams, achievements, projects]
      properties:
        name:
          type: string
        age:
          type: integer
          minimum: 0
        city:
          type: string
        avatarUrl:
          type: string
          format: uri
        role:
          type: string
        status:
          type: string
        skills:
          $ref: '#/components/schemas/TextList'
        summary:
          type: string
        about:
          type: string
        teams:
          $ref: '#/components/schemas/TextList'
        achievements:
          $ref: '#/components/schemas/TextList'
        projects:
          $ref: '#/components/schemas/TextList'
    Person:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              minLength: 1
    OwnProfile:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          required: [preferences]
          properties:
            preferences:
              $ref: '#/components/schemas/Preferences'
            teamSearch:
              $ref: '#/components/schemas/TeamSearchMode'
    TeamSearchMode:
      oneOf:
        - type: 'null'
        - type: object
          required: [kind, eventId, eventTitle]
          properties:
            kind:
              const: event
            eventId:
              type: string
              minLength: 1
            eventTitle:
              type: string
              minLength: 1
              description: Название события для отображения в профиле после его окончания.
        - type: object
          required: [kind]
          properties:
            kind:
              const: other
            title:
              type: string
              maxLength: 120
    Hackathon:
      type: object
      required: [id, title, startsOn, endsOn, location, tags]
      properties:
        id:
          type: string
        title:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
          description: Дата окончания, равна дате начала или позже.
        location:
          type: string
        tags:
          $ref: '#/components/schemas/TextList'
        previewUrl:
          type: string
          format: uri
          description: URL прямоугольной обложки события.
        prizePool:
          type: string
          description: Призовой фонд с валютой или описанием призов.
        description:
          type: string
          description: Описание события для экрана подробностей.
        eventUrl:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS-ссылка на страницу события у организаторов.
        registrationUrl:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS-ссылка на форму регистрации организатора, если она известна.
    Invitation:
      type: object
      required: [id, direction, status, person]
      properties:
        id:
          type: string
        direction:
          enum: [incoming, outgoing]
        status:
          enum: [pending, accepted, declined]
        person:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
            telegramUsername:
              type: string
              pattern: '^[A-Za-z0-9_]{1,32}$'
              description: Имя пользователя без знака @. Возвращается только участникам принятого приглашения.
        event:
          type: object
          required: [id, title]
          properties:
            id:
              type: string
            title:
              type: string

