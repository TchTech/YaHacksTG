<svg xmlns='http://www.w3.org/2000/svg' width='1800' height='1700' viewBox='0 0 1800 1700'><title>REST API: приглашения и портфолио</title><rect width='1800' height='1700' fill='#F4F6F8'/><rect x='80' y='64' width='14' height='14' rx='3' fill='#F4D35E' stroke='none'/><text x='108' y='80' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>YaHacks</text><text x='1380' y='80' font-family='Arial, sans-serif' font-size='20' font-weight='400' fill='#596878'>Технический проект / MVP</text><text x='80' y='150' font-family='Arial, sans-serif' font-size='43' font-weight='700' fill='#18212B'>REST API: приглашения и портфолио</text><text x='80' y='197' font-family='Arial, sans-serif' font-size='24' font-weight='400' fill='#596878'>Статусы, права доступа, HTTP-коды и основные форматы ответов</text><rect x='80' y='250' width='800' height='454' rx='18' fill='#FFFFFF' stroke='#C5CED7'/><text x='106' y='296' font-family='Arial, sans-serif' font-size='27' font-weight='700' fill='#18212B'>Приглашения</text><rect x='106' y='338' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='116' y='362' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='216' y='363' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/invitations?status=pending</text><text x='106' y='403' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Входящие и исходящие приглашения.</text><text x='788' y='403' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 430 H 854' stroke='#E6EAF0'/><rect x='106' y='456' width='94' height='34' rx='7' fill='#E8F3EC' stroke='none'/><text x='116' y='480' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#286947'>POST</text><text x='216' y='481' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/teams/{id}/invitations</text><text x='106' y='521' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Капитан приглашает выбранного участника.</text><text x='788' y='521' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>201</text><path d='M 106 548 H 854' stroke='#E6EAF0'/><rect x='106' y='574' width='94' height='34' rx='7' fill='#FFF3D7' stroke='none'/><text x='116' y='598' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#876114'>PATCH</text><text x='216' y='599' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/invitations/{id}</text><text x='106' y='639' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Ответ получателя или отмена отправителем.</text><text x='788' y='639' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><rect x='80' y='755' width='800' height='256' rx='14' fill='#FFF7D8' stroke='none'/><text x='106' y='799' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>Переходы статуса</text><text x='106' y='841' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>pending → accepted / declined / cancelled / expired</text><text x='106' y='880' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Получатель: accepted или declined.</text><text x='106' y='919' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Отправитель: cancelled. Сервер: expired.</text><text x='106' y='958' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>accepted создаёт членство в одной транзакции.</text><rect x='80' y='1060' width='800' height='217' rx='14' fill='#FFF7D8' stroke='none'/><text x='106' y='1104' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>Тела запросов</text><text x='106' y='1146' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>POST: { &quot;recipientId&quot;: &quot;uuid&quot;, &quot;roleId&quot;: &quot;uuid&quot; }</text><text x='106' y='1185' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>PATCH: { &quot;status&quot;: &quot;accepted&quot; }</text><text x='106' y='1224' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>409: команда заполнена или участник уже в команде.</text><rect x='920' y='250' width='800' height='808' rx='18' fill='#FFFFFF' stroke='#C5CED7'/><text x='946' y='296' font-family='Arial, sans-serif' font-size='27' font-weight='700' fill='#18212B'>Проекты и достижения</text><rect x='946' y='338' width='94' height='34' rx='7' fill='#E8F3EC' stroke='none'/><text x='956' y='362' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#286947'>POST</text><text x='1056' y='363' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/projects</text><text x='946' y='403' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Добавить проект в портфолио.</text><text x='1628' y='403' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>201</text><path d='M 946 430 H 1694' stroke='#E6EAF0'/><rect x='946' y='456' width='94' height='34' rx='7' fill='#FFF3D7' stroke='none'/><text x='956' y='480' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#876114'>PATCH</text><text x='1056' y='481' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/projects/{id}</text><text x='946' y='521' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Владелец обновляет описание и ссылки.</text><text x='1628' y='521' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 548 H 1694' stroke='#E6EAF0'/><rect x='946' y='574' width='94' height='34' rx='7' fill='#F8EAEA' stroke='none'/><text x='956' y='598' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#9D4141'>DELETE</text><text x='1056' y='599' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/projects/{id}</text><text x='946' y='639' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Владелец удаляет проект.</text><text x='1628' y='639' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>204</text><path d='M 946 666 H 1694' stroke='#E6EAF0'/><rect x='946' y='692' width='94' height='34' rx='7' fill='#E8F3EC' stroke='none'/><text x='956' y='716' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#286947'>POST</text><text x='1056' y='717' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/achievements</text><text x='946' y='757' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Добавить достижение со статусом unverified.</text><text x='1628' y='757' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>201</text><path d='M 946 784 H 1694' stroke='#E6EAF0'/><rect x='946' y='810' width='94' height='34' rx='7' fill='#FFF3D7' stroke='none'/><text x='956' y='834' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#876114'>PATCH</text><text x='1056' y='835' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/achievements/{id}</text><text x='946' y='875' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Владелец изменяет поля; проверка сбрасывается.</text><text x='1628' y='875' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 902 H 1694' stroke='#E6EAF0'/><rect x='946' y='928' width='94' height='34' rx='7' fill='#F8EAEA' stroke='none'/><text x='956' y='952' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#9D4141'>DELETE</text><text x='1056' y='953' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/achievements/{id}</text><text x='946' y='993' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Владелец удаляет достижение.</text><text x='1628' y='993' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>204</text><rect x='920' y='1150' width='800' height='295' rx='14' fill='#FFF7D8' stroke='none'/><text x='946' y='1194' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>Правила контрактов</text><text x='946' y='1236' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Списки: { items: [...], nextCursor: null }</text><text x='946' y='1275' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Ошибки: 401 / 403 / 404 / 409 / 422.</text><text x='946' y='1314' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Ошибка: { code: &quot;TEAM_FULL&quot;, message: &quot;...&quot; }</text><text x='946' y='1353' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Idempotency-Key для POST приглашения.</text><text x='946' y='1392' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>verification_status меняет только администратор.</text><text x='80' y='1623' font-family='Arial, sans-serif' font-size='20' font-weight='400' fill='#596878'>Предварительный контракт • /api/v1 • JSON • даты в UTC</text><text x='1640' y='1623' font-family='Arial, sans-serif' font-size='20' font-weight='700' fill='#18212B'>06/06</text></svg>