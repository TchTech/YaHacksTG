<svg xmlns='http://www.w3.org/2000/svg' width='1800' height='1700' viewBox='0 0 1800 1700'><title>REST API: события и команды</title><rect width='1800' height='1700' fill='#F4F6F8'/><rect x='80' y='64' width='14' height='14' rx='3' fill='#F4D35E' stroke='none'/><text x='108' y='80' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>YaHacks</text><text x='1380' y='80' font-family='Arial, sans-serif' font-size='20' font-weight='400' fill='#596878'>Технический проект / MVP</text><text x='80' y='150' font-family='Arial, sans-serif' font-size='43' font-weight='700' fill='#18212B'>REST API: события и команды</text><text x='80' y='197' font-family='Arial, sans-serif' font-size='24' font-weight='400' fill='#596878'>Управление составом, ролями и избранными мероприятиями</text><rect x='80' y='250' width='800' height='808' rx='18' fill='#FFFFFF' stroke='#C5CED7'/><text x='106' y='296' font-family='Arial, sans-serif' font-size='27' font-weight='700' fill='#18212B'>События и избранное</text><rect x='106' y='338' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='116' y='362' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='216' y='363' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/events?format=online&amp;cursor=...</text><text x='106' y='403' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Каталог: формат, даты, город; пагинация.</text><text x='788' y='403' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 430 H 854' stroke='#E6EAF0'/><rect x='106' y='456' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='116' y='480' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='216' y='481' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/events/{id}</text><text x='106' y='521' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Детали события и сроки регистрации.</text><text x='788' y='521' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 548 H 854' stroke='#E6EAF0'/><rect x='106' y='574' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='116' y='598' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='216' y='599' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/saved-events</text><text x='106' y='639' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Избранные события текущего пользователя.</text><text x='788' y='639' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 666 H 854' stroke='#E6EAF0'/><rect x='106' y='692' width='94' height='34' rx='7' fill='#EEEAF8' stroke='none'/><text x='116' y='716' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#655291'>PUT</text><text x='216' y='717' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/saved-events/{eventId}</text><text x='106' y='757' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Сохранить событие; повтор безопасен.</text><text x='788' y='757' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>204</text><path d='M 106 784 H 854' stroke='#E6EAF0'/><rect x='106' y='810' width='94' height='34' rx='7' fill='#F8EAEA' stroke='none'/><text x='116' y='834' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#9D4141'>DELETE</text><text x='216' y='835' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/saved-events/{eventId}</text><text x='106' y='875' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Убрать из избранного; повтор безопасен.</text><text x='788' y='875' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>204</text><path d='M 106 902 H 854' stroke='#E6EAF0'/><rect x='106' y='928' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='116' y='952' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='216' y='953' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/teams</text><text x='106' y='993' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Свои команды и членство по событиям.</text><text x='788' y='993' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><rect x='920' y='250' width='800' height='808' rx='18' fill='#FFFFFF' stroke='#C5CED7'/><text x='946' y='296' font-family='Arial, sans-serif' font-size='27' font-weight='700' fill='#18212B'>Команды и состав</text><rect x='946' y='338' width='94' height='34' rx='7' fill='#E8F3EC' stroke='none'/><text x='956' y='362' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#286947'>POST</text><text x='1056' y='363' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/teams</text><text x='946' y='403' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Создать команду и членство капитана.</text><text x='1628' y='403' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>201</text><path d='M 946 430 H 1694' stroke='#E6EAF0'/><rect x='946' y='456' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='956' y='480' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='1056' y='481' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/teams/{id}</text><text x='946' y='521' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Состав, событие и открытые роли.</text><text x='1628' y='521' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 548 H 1694' stroke='#E6EAF0'/><rect x='946' y='574' width='94' height='34' rx='7' fill='#FFF3D7' stroke='none'/><text x='956' y='598' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#876114'>PATCH</text><text x='1056' y='599' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/teams/{id}</text><text x='946' y='639' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Капитан меняет название, лимит и статус.</text><text x='1628' y='639' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 666 H 1694' stroke='#E6EAF0'/><rect x='946' y='692' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='956' y='716' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='1056' y='717' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/teams/{id}/members</text><text x='946' y='757' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Получить текущих участников команды.</text><text x='1628' y='757' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 784 H 1694' stroke='#E6EAF0'/><rect x='946' y='810' width='94' height='34' rx='7' fill='#F8EAEA' stroke='none'/><text x='956' y='834' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#9D4141'>DELETE</text><text x='1056' y='835' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/teams/{id}/members/{userId}</text><text x='946' y='875' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Выход участника или исключение капитаном.</text><text x='1628' y='875' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>204</text><path d='M 946 902 H 1694' stroke='#E6EAF0'/><rect x='946' y='928' width='94' height='34' rx='7' fill='#EEEAF8' stroke='none'/><text x='956' y='952' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#655291'>PUT</text><text x='1056' y='953' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/teams/{id}/needs</text><text x='946' y='993' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Капитан заменяет список требуемых ролей.</text><text x='1628' y='993' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><rect x='80' y='1150' width='800' height='256' rx='14' fill='#FFF7D8' stroke='none'/><text x='106' y='1194' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>Создание команды</text><text x='106' y='1236' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>POST /teams</text><text x='106' y='1275' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>{ &quot;eventId&quot;: &quot;uuid&quot;, &quot;name&quot;: &quot;Orbit&quot;,</text><text x='106' y='1314' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>  &quot;capacity&quot;: 5 }</text><text x='106' y='1353' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Ответ: команда с membership_role = captain.</text><rect x='920' y='1150' width='800' height='256' rx='14' fill='#FFF7D8' stroke='none'/><text x='946' y='1194' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>Права и ограничения</text><text x='946' y='1236' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>POST /admin/events → 201; PATCH /admin/events/{id} → 200</text><text x='946' y='1275' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>События создаёт и редактирует администратор.</text><text x='946' y='1314' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Капитан не выходит без передачи полномочий.</text><text x='946' y='1353' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Избранное не регистрирует на мероприятие.</text><text x='80' y='1623' font-family='Arial, sans-serif' font-size='20' font-weight='400' fill='#596878'>Предварительный контракт • /api/v1 • JSON • даты в UTC</text><text x='1640' y='1623' font-family='Arial, sans-serif' font-size='20' font-weight='700' fill='#18212B'>05/06</text></svg>