<svg xmlns='http://www.w3.org/2000/svg' width='1800' height='1700' viewBox='0 0 1800 1700'><title>REST API: авторизация и профиль</title><rect width='1800' height='1700' fill='#F4F6F8'/><rect x='80' y='64' width='14' height='14' rx='3' fill='#F4D35E' stroke='none'/><text x='108' y='80' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>YaHacks</text><text x='1380' y='80' font-family='Arial, sans-serif' font-size='20' font-weight='400' fill='#596878'>Технический проект / MVP</text><text x='80' y='150' font-family='Arial, sans-serif' font-size='43' font-weight='700' fill='#18212B'>REST API: авторизация и профиль</text><text x='80' y='197' font-family='Arial, sans-serif' font-size='24' font-weight='400' fill='#596878'>Сессия, справочники и поиск участников по заданным фильтрам</text><rect x='80' y='250' width='800' height='808' rx='18' fill='#FFFFFF' stroke='#C5CED7'/><text x='106' y='296' font-family='Arial, sans-serif' font-size='27' font-weight='700' fill='#18212B'>Сессия и собственный профиль</text><rect x='106' y='338' width='94' height='34' rx='7' fill='#E8F3EC' stroke='none'/><text x='116' y='362' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#286947'>POST</text><text x='216' y='363' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/auth/telegram</text><text x='106' y='403' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Вход: проверка подписи initData и времени auth_date.</text><text x='788' y='403' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 430 H 854' stroke='#E6EAF0'/><rect x='106' y='456' width='94' height='34' rx='7' fill='#F8EAEA' stroke='none'/><text x='116' y='480' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#9D4141'>DELETE</text><text x='216' y='481' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/auth/session</text><text x='106' y='521' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Завершить текущую сессию.</text><text x='788' y='521' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>204</text><path d='M 106 548 H 854' stroke='#E6EAF0'/><rect x='106' y='574' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='116' y='598' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='216' y='599' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me</text><text x='106' y='639' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Получить собственный профиль.</text><text x='788' y='639' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 666 H 854' stroke='#E6EAF0'/><rect x='106' y='692' width='94' height='34' rx='7' fill='#FFF3D7' stroke='none'/><text x='116' y='716' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#876114'>PATCH</text><text x='216' y='717' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me</text><text x='106' y='757' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Изменить имя, город, bio и доступность.</text><text x='788' y='757' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 784 H 854' stroke='#E6EAF0'/><rect x='106' y='810' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='116' y='834' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='216' y='835' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/preferences</text><text x='106' y='875' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Получить настройки и напоминания.</text><text x='788' y='875' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 106 902 H 854' stroke='#E6EAF0'/><rect x='106' y='928' width='94' height='34' rx='7' fill='#FFF3D7' stroke='none'/><text x='116' y='952' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#876114'>PATCH</text><text x='216' y='953' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/preferences</text><text x='106' y='993' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Обновить предпочтения и уведомления.</text><text x='788' y='993' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><rect x='920' y='250' width='800' height='808' rx='18' fill='#FFFFFF' stroke='#C5CED7'/><text x='946' y='296' font-family='Arial, sans-serif' font-size='27' font-weight='700' fill='#18212B'>Справочники и каталог участников</text><rect x='946' y='338' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='956' y='362' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='1056' y='363' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/roles</text><text x='946' y='403' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Справочник ролей.</text><text x='1628' y='403' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 430 H 1694' stroke='#E6EAF0'/><rect x='946' y='456' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='956' y='480' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='1056' y='481' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/skills?q=python</text><text x='946' y='521' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Поиск в справочнике навыков.</text><text x='1628' y='521' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 548 H 1694' stroke='#E6EAF0'/><rect x='946' y='574' width='94' height='34' rx='7' fill='#EEEAF8' stroke='none'/><text x='956' y='598' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#655291'>PUT</text><text x='1056' y='599' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/skills</text><text x='946' y='639' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Заменить свой набор навыков и уровней.</text><text x='1628' y='639' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 666 H 1694' stroke='#E6EAF0'/><rect x='946' y='692' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='956' y='716' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='1056' y='717' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/users?eventId=...&amp;roleId=...</text><text x='946' y='757' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Фильтры: событие, роль, навыки, город.</text><text x='1628' y='757' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 784 H 1694' stroke='#E6EAF0'/><rect x='946' y='810' width='94' height='34' rx='7' fill='#EAF1FC' stroke='none'/><text x='956' y='834' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#28568D'>GET</text><text x='1056' y='835' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/users/{id}</text><text x='946' y='875' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Профиль, проекты и достижения участника.</text><text x='1628' y='875' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>200</text><path d='M 946 902 H 1694' stroke='#E6EAF0'/><rect x='946' y='928' width='94' height='34' rx='7' fill='#E8F3EC' stroke='none'/><text x='956' y='952' font-family='Consolas, monospace' font-size='19' font-weight='700' fill='#286947'>POST</text><text x='1056' y='953' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>/me/skipped-candidates</text><text x='946' y='993' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#596878'>Пропустить кандидата в рамках события.</text><text x='1628' y='993' font-family='Consolas, monospace' font-size='20' font-weight='700' fill='#18212B'>201</text><rect x='80' y='1150' width='800' height='256' rx='14' fill='#FFF7D8' stroke='none'/><text x='106' y='1194' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>Вход через Telegram</text><text x='106' y='1236' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>POST /auth/telegram</text><text x='106' y='1275' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>{ &quot;initData&quot;: &quot;&lt;строка Telegram&gt;&quot; }</text><text x='106' y='1314' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Ответ: { user: {...} } + cookie сессии.</text><text x='106' y='1353' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Cookie: HttpOnly; Secure.</text><rect x='920' y='1150' width='800' height='256' rx='14' fill='#FFF7D8' stroke='none'/><text x='946' y='1194' font-family='Arial, sans-serif' font-size='25' font-weight='700' fill='#18212B'>Обычный поиск и фильтры</text><text x='946' y='1236' font-family='Consolas, monospace' font-size='21' font-weight='400' fill='#18212B'>{ &quot;candidateId&quot;: &quot;uuid&quot;, &quot;eventId&quot;: &quot;uuid&quot; }</text><text x='946' y='1275' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Каталог исключает пропущенных участников.</text><text x='946' y='1314' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>user_id берётся из сессии.</text><text x='946' y='1353' font-family='Arial, sans-serif' font-size='21' font-weight='400' fill='#18212B'>Чужой профиль не содержит приватных настроек.</text><text x='80' y='1623' font-family='Arial, sans-serif' font-size='20' font-weight='400' fill='#596878'>Предварительный контракт • /api/v1 • JSON • даты в UTC</text><text x='1640' y='1623' font-family='Arial, sans-serif' font-size='20' font-weight='700' fill='#18212B'>04/06</text></svg>